spring:
  application:
    name: music-playlist

  datasource:
    url: jdbc:h2:mem:musicplaylist
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  app:
    sample-data:
      enabled: true